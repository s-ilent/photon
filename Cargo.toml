[package]
name = "photon"
version = "0.1.0"
edition = "2021"
authors = ["Silent <silent@noemail.xyz>"]
description = "Fast image viewer/browser written in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/s-ilent/photon"
readme = "README.md"

[dependencies]
eframe = "0.34"
egui = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "dds", "exr", "webp"] }
rfd = "0.17"
walkdir = "2"
arboard = { version = "3", features = ["wayland-data-control"] }
wgpu = "29"
egui-wgpu = "0.34"
lru = "0.18.5"
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
directories = "6.0.0"
log = "0.4"
env_logger = "0.11"
egui-phosphor = "0.12"
notify-debouncer-full = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
