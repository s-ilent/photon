[package]
name = "photon"
version = "0.1.0"
edition = "2021"
authors = ["Silent <silent@noemail.xyz>"]
description = "Fast image viewer/browser written in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/s-ilent/photon"
readme = "README.md"

[dependencies]
eframe = "0.34"
egui = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "dds", "exr", "webp", "tga", "pnm", "ico", "hdr"] }
rfd = "0.17"
walkdir = "2"
arboard = { version = "3", features = ["wayland-data-control"] }
wgpu = "29"
egui-wgpu = "0.34"
lru = "0.18.5"
bytemuck = { version = "1", features = ["derive"] }
half = "2"
jiff = "0.2"
humansize = "2"
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
exif = { package = "kamadak-exif", version = "0.6.1" }
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
directories = "6.0.0"
log = "0.4"
env_logger = "0.11"
egui-phosphor = "0.12"
notify-debouncer-full = "0.7"
rayon = "1.12.0"
shellexpand = "3"

[dev-dependencies]
pollster = "0.4"
tempfile = "3"

# egui-winit carries a one-hunk patch (Ctrl+V on image clipboards);
# see VENDOR_NOTES.md.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
